<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>六十甲子籤・第四十九籤</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1a0a2e;
    --card: rgba(50, 20, 80, 0.6);
    --gold: #f0d68a;
    --gold-light: #faecc8;
    --red: #e06050;
    --text: #e8dcc8;
    --muted: rgba(232, 220, 200, 0.6);
    --line: rgba(240, 214, 138, 0.3);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5efe0;
      --card: rgba(255, 248, 235, 0.85);
      --gold: #8b6914;
      --gold-light: #b8962e;
      --red: #a03020;
      --text: #3a2a1a;
      --muted: rgba(58, 42, 26, 0.6);
      --line: rgba(139, 105, 20, 0.25);
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 500 14px/1.5 ui-serif, "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  }
  main {
    max-width: 780px;
    margin: 20px auto;
    padding: 0 16px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 2px 12px rgba(0,0,0,0.3));
  }
  .card-bg { fill: var(--card); stroke: var(--gold); stroke-width: 1.5; rx: 14; ry: 14; }
  .title { font-size: 22px; font-weight: 700; fill: var(--gold); }
  .subtitle { font-size: 13px; fill: var(--red); }
  .ganzhi { font-size: 13px; fill: var(--gold-light); }
  .attr { font-size: 12px; fill: var(--muted); }
  .poetry-line { font-size: 17px; font-weight: 600; fill: var(--text); }
  .section-title { font-size: 14px; font-weight: 700; fill: var(--gold); }
  .interp-text { font-size: 11.5px; fill: var(--text); }
  .interp-muted { font-size: 11px; fill: var(--muted); }
  .verse-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
  .deco-circle { fill: none; stroke: var(--gold); stroke-width: 0.8; opacity: 0.4; }
  .footer-text { font-size: 10px; fill: var(--muted); }
</style>
<main>
<svg viewBox="0 0 740 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(240,214,138,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background card -->
  <rect x="20" y="20" width="700" height="1160" class="card-bg"/>
  <rect x="20" y="20" width="700" height="1160" fill="url(#glow)" rx="14"/>

  <!-- Decorative circles -->
  <circle cx="370" cy="90" r="60" class="deco-circle"/>
  <circle cx="370" cy="90" r="45" class="deco-circle"/>
  <circle cx="370" cy="90" r="30" class="deco-circle"/>

  <!-- Title -->
  <text x="370" y="100" text-anchor="middle" class="title">🎋 六十甲子籤</text>

  <!-- Sign & Ganzhi -->
  <text x="370" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="var(--gold)">第四十九籤</text>
  <text x="370" y="172" text-anchor="middle" class="ganzhi">【壬子】</text>
  <text x="370" y="195" text-anchor="middle" class="attr">屬木利春 · 宜其東方</text>

  <!-- Divider -->
  <line x1="120" y1="215" x2="620" y2="215" class="verse-line"/>

  <!-- Poetry -->
  <text x="370" y="255" text-anchor="middle" class="poetry-line">言語雖多不可從</text>
  <text x="370" y="288" text-anchor="middle" class="poetry-line">風雲靜處未行龍</text>
  <text x="370" y="321" text-anchor="middle" class="poetry-line">暗中終得明消息</text>
  <text x="370" y="354" text-anchor="middle" class="poetry-line">君爾何須問重重</text>

  <!-- Divider -->
  <line x1="120" y1="380" x2="620" y2="380" class="verse-line"/>

  <!-- Interpretation -->
  <text x="60" y="415" class="section-title">📖 完整解說</text>

  <text x="60" y="450" class="interp-text">
    <tspan x="60" dy="0">1️⃣ 外界的意見雖然多，但不必全部聽從。保持自己的判斷力，</tspan>
    <tspan x="75" dy="20">不要讓眾說紛紜擾亂你的方向。</tspan>
  </text>
  <text x="60" y="500" class="interp-text">
    <tspan x="60" dy="0">2️⃣ 目前局勢表面平靜，如同風靜雲止，但龍尚未出動。</tspan>
    <tspan x="75" dy="20">行動的最佳時機還沒到，宜靜觀其變。</tspan>
  </text>
  <text x="60" y="550" class="interp-text">
    <tspan x="60" dy="0">3️⃣ 雖然眼下情況不明、感到迷茫，但隨著時間過去，</tspan>
    <tspan x="75" dy="20">關鍵的資訊或突破口會漸漸浮現。保持耐心。</tspan>
  </text>
  <text x="60" y="600" class="interp-text">
    <tspan x="60" dy="0">4️⃣ 不必反覆求問、過度焦慮。專注當下能做的事，</tspan>
    <tspan x="75" dy="20">順其自然，事情終會水到渠成。</tspan>
  </text>

  <!-- Guidance section -->
  <line x1="120" y1="640" x2="620" y2="640" class="verse-line"/>

  <text x="60" y="675" class="section-title">💡 方向指引</text>

  <text x="60" y="710" class="interp-text">
    <tspan x="60" dy="0" font-weight="700">工作／學業：</tspan>
    <tspan x="75" dy="20">保持專注，避免被過多的意見干擾方向。耐心等待時機。</tspan>
  </text>
  <text x="60" y="760" class="interp-text">
    <tspan x="60" dy="0" font-weight="700">事業／計畫：</tspan>
    <tspan x="75" dy="20">現在不是急著行動的時候，等局勢明朗再決策。</tspan>
  </text>
  <text x="60" y="810" class="interp-text">
    <tspan x="60" dy="0" font-weight="700">財運：</tspan>
    <tspan x="75" dy="20">決策保持謹慎，不要聽信小道消息。隨著時間推移，</tspan>
    <tspan x="75" dy="20">財務機會將逐漸明朗。</tspan>
  </text>
  <text x="60" y="870" class="interp-text">
    <tspan x="60" dy="0" font-weight="700">建議行動方向：</tspan>
    <tspan x="75" dy="20">選擇春季或朝東方行動，更有助於順利發展。</tspan>
  </text>

  <!-- Key message box -->
  <rect x="80" y="920" width="580" height="90" rx="10" ry="10" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="370" y="950" text-anchor="middle" class="section-title">🔑 核心意涵</text>
  <text x="370" y="980" text-anchor="middle" class="interp-text" font-weight="600">靜待風雲 · 心定則明</text>
  <text x="370" y="1000" text-anchor="middle" class="interp-muted">不急不躁，信任過程，答案將自然浮現</text>

  <!-- Footer -->
  <text x="370" y="1080" text-anchor="middle" class="footer-text">🌸 Flora 為你抽出 · 壬子籤 · 2026-06-23</text>
  <text x="370" y="1098" text-anchor="middle" class="footer-text">六十甲子籤第四十九籤 — 安心靜待，自有清明</text>
</svg>
</main>
</body>
</html>
