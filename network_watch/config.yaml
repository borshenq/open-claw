# ============================================================
# 🌐 Network Watch - 網路埠口異動監控設定檔
# 修改這個檔案就好，不用碰程式碼
# ============================================================

# 要掃描的網段（可多個）
targets:
  - "192.60.1.0/24"      # 學校主要網段
  - "192.168.0.0/24"     # 教室網段
  # - "192.168.10.0/24"  # 監視器網段（取消註解即可啟用）

# 要掃描的埠口（常見服務）
# 格式：埠號 or "埠號-埠號"（範圍）
ports:
  - 21      # FTP
  - 22      # SSH
  - 80      # HTTP
  - 139     # NetBIOS
  - 443     # HTTPS
  - 445     # SMB
  - 3389    # RDP
  - 7070    # 某主機開過的埠
  - 8080    # HTTP Proxy / Tomcat
  - 8443    # HTTPS Alt

# 排除清單（這些 IP 不會被監控）
exclude:
  - "192.60.1.254"       # UniFi Gateway（路由器）
  - "192.60.1.107"       # 本機（OpenClaw VM）
  - "192.168.0.254"      # 教室網段 Gateway
  # - "192.60.1.115"     # 如果需要排除才取消註解

# 掃描參數
scan:
  # nmap 速度參數 T0-T5（T0=最慢最準，T5=最快但可能漏）
  # T3 是預設平衡值，同網段建議 T4
  timing_template: "T4"
  
  # ping sweep 超時（秒）
  ping_timeout: 2

# Telegram 通知設定
telegram:
  enabled: true
  # 使用環境變數 TOOLS.md 記錄的 bot，用你帳號內建的
  # 不需要額外 bot_token，用 OpenClaw 自己的 Telegram 機制
  chat_id: "8344400160"   # 你的 Telegram ID

# 排程設定（crontab 格式）
schedule: "0 */4 * * *"  # 每 4 小時執行一次

# 日誌保留天數
log_retention_days: 30
